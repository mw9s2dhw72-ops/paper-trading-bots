# Scheduled paper-trading step. Runs only from the default branch (main).
# GitHub may start a */5 cron late; the engine catches up signals, stops and a missed 00:30 UTC evolution.
# A commit on the `data` branch each run is repository activity. GitHub disables scheduled workflows
# after 60 days with no repository activity; these commits should keep the schedule alive. If it is
# paused anyway, re-enable the workflow from the Actions tab.
name: Paper trade

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      reset:
        description: "Restore the 2026-11-04 15:19 UTC snapshot, then run one step"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

# One run at a time. A newer queued run replaces an older queued run, so a slow
# deploy cannot pile up, and two steps never trade the same state.
concurrency:
  group: paper-trading-bots
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: data_branch
          fetch-depth: 5
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify price sources and stop logic
        run: python trading-evolution/live/test_scheduled.py

      - name: Run one paper step
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          extra=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.reset }}" = "true" ]; then
            extra="--reset"
          fi
          python trading-evolution/live/run_once.py --data-dir data_branch --site site $extra

      - name: Commit state to the data branch
        working-directory: data_branch
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A
          if git diff --cached --quiet; then
            echo "no state changes"
            exit 0
          fi
          git commit -m "paper state $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:data; then
              exit 0
            fi
            echo "push failed (attempt $i); rebasing onto origin/data"
            git fetch origin data
            if ! git rebase origin/data; then
              echo "data branch moved and the rebase did not apply; leaving it for the next run"
              exit 1
            fi
            sleep $((2 ** i))
          done
          exit 1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: paper
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
